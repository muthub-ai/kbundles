# Unprivileged trigger: pull_request_review runs merge-ref code, so nothing privileged lives here.
# Its completion fires kf-gate-rerun.yml (workflow_run), which runs default-branch code.
name: kf-gate-review
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "review on PR ${PR_NUMBER}; kf-gate-rerun will re-evaluate approval"
