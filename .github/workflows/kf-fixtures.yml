# Runs the whole scenario matrix (green and red) in gate local mode — proves every verdict,
# including the approval, merge, refresh and revert paths the single-identity live repo cannot show.
name: kf-fixtures
on:
  push:
    branches: [main]
  pull_request:   # only PRs that change the gate, tools or scenarios; knowledge PRs are judged by kf-knowledge-gate
    paths: [".github/**", "gate/**", "tools/**", "skills/**", "scenarios/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r .github/kf/toolchain.lock
      - name: Run scenario matrix
        run: python3 scenarios/run_fixtures.py --report "$GITHUB_STEP_SUMMARY"
