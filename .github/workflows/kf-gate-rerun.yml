# Re-evaluates content-bound approval after a review, executing DEFAULT-BRANCH code.
name: kf-gate-rerun
on:
  workflow_run:
    workflows: [kf-gate-review]
    types: [completed]
permissions: {}
jobs:
  gate:
    if: github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 — default branch
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r .github/kf/toolchain.lock
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 gate/run.py --github --pr ${{ github.event.workflow_run.pull_requests[0].number }}
