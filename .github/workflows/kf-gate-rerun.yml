# Re-evaluates content-bound approval after a review, executing DEFAULT-BRANCH code.
name: kf-gate-rerun
on:
  workflow_run:
    workflows: [kf-gate-review]
    types: [completed]
permissions: {}
jobs:
  gate:
    if: github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0 — default branch
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r .github/kf/toolchain.lock
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 gate/run.py --github --pr ${{ github.event.workflow_run.pull_requests[0].number }}
