# kbundles trust root — CODE-OWNER REVIEW REQUIRED (see .github/CODEOWNERS).
# The gate reads this file from the BASE ref only, so a PR can never change
# the registry, teams, owners or fallback approvers that judge it.
schema: kf-trust-root/1
repo: muthub-ai/kbundles
code_owners: [muthub-ai, genlinemedia]
code_reserved_appids: [index, admin, other, appbd, dombd, prcbd]
reserved_team_slugs: [index, log, all, shared, archive, standup, sprint-planning, backlog-refinement, retro]
ceremonies: [standup, sprint-planning, backlog-refinement, retro]
require_synthetic: true            # this prototype's meetings and teams are fabricated
revert_fallback_approvers: [muthub-ai, genlinemedia]
# Fallback approvers for any app that has no application-bundles/<appid>/OWNERS file yet,
# and the approvers of an app's FIRST OWNERS file (the "claim"). Spec v0.5.
kf_stewards: [muthub-ai, genlinemedia]
