    criterion: "§6.4 G11 (i) · confirm-round fixture"
    steps:
      - bundle_edit:
          appid: kfcor
          ops:
            - {op: replace, file: code-graph/code-graph.jsonl, find: '"tree-sitter":"0.25.2"', replace: '"tree-sitter":"0.26.0"'}
      - gate: {expect: failure, gates: [G11]}
  - id: R23
    title: Hand-edited graph does not reproduce byte-for-byte
    criterion: "§6.4 G11 (iii)"
    steps:
      - bundle_edit:
          appid: kfcor
          ops:
            - {op: graph_bump_bytes, file: code-graph/code-graph.jsonl}
      - gate: {expect: failure, gates: [G11]}
  - id: R24
    title: Mixed commit SHAs inside one bundle
    criterion: "§6.3 · B6 mixed-version rule"
    steps:
      - bundle_edit:
          appid: kfcor
          stamp: false
          ops:
            - {op: replace, file: sections/executive-summary.md, find: "commit_sha: 78d41952391c91356afbebfaee129b8b40a12561",
               replace: "commit_sha: 0000000000000000000000000000000000000000"}
      - gate: {expect: failure, gates: [B6]}
  - id: R25
