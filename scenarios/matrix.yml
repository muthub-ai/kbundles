  - id: R07
    title: Approver is the PR author
    criterion: "§13 #5 · G7"
    steps:
      - simulate: {scenario: scenarios/cases/R07-approver-is-author.json}
      - gate: {expect: failure, gates: [G7]}
  - id: R08
    title: Email address in knowledge text
    criterion: "§13 #5 · G9"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R08-pii-email.json}
      - gate: {expect: failure, gates: [G9]}
  - id: R09
    title: Ceremony PR also rewrites the bundle manifest — outside knowledge-sources/
    criterion: "spec v0.5 write-set · G1 · PC"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R09-manifest-reserialized.json}
      - gate: {expect: failure, gates: [G1]}
  - id: R10
    title: New ceremony-team log seeded with fabricated history
    criterion: "§13 #9 · G4 creation rule"
    steps:
      - simulate: {scenario: scenarios/cases/R10-fake-team-log-history.json}
      - gate: {expect: failure, gates: [G4]}
  - id: R13
    title: Ceremony PR touches the appid-root log.md
    criterion: "§13 #5 · D16 · G1"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R13-root-log-touched.json}
      - gate: {expect: failure, gates: [G1]}
  - id: R14
    title: Trust-root config edited inside a knowledge PR — class unknown, fails closed
    criterion: "plan §6.1 · P1"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R14-trust-root-mixed.json}
      - gate: {expect: failure, class: unknown, gates: [CLASS]}
  - id: R15
    title: RSK- item in a standup (profile violation)
    criterion: "§5.2 · G2"
    steps:
      - simulate: {scenario: scenarios/cases/R15-risk-in-standup.json}
      - gate: {expect: failure, gates: [G2]}
  - id: R16
    title: Ceremony date in the future in every time zone (UTC+14 rule)
    criterion: "§14 · G3"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R16-future-date.json}
      - gate: {expect: failure, gates: [G3]}
  - id: R17
    title: Short (4-segment) grill branch
    criterion: "§14 · G3"
    steps:
      - simulate: {scenario: scenarios/cases/R17-short-branch.json}
      - gate: {expect: failure, gates: [G3]}
  - id: R18
    title: Commit without the client trailer
    criterion: "G10"
    steps:
      - simulate: {scenario: scenarios/cases/R18-missing-trailer.json}
      - gate: {expect: failure, gates: [G10]}
  - id: R19
    title: Symlink in a knowledge PR
    criterion: "§13 #5 · G1"
    steps:
      - simulate: {scenario: scenarios/cases/R19-symlink.json}
      - gate: {expect: failure, gates: [G1]}
  - id: R20
    title: Rename of an accepted ceremony file (delete + add) without a revert
    criterion: "§13 #5 · protected content · revert class"
    steps:
      - simulate: {scenario: scenarios/cases/R20-rename-accepted.json}
      - gate: {expect: failure, gates: [RV]}
  - id: R26
    title: Reserved team slug
    criterion: "§14 · G3"
    steps:
      - simulate: {scenario: scenarios/cases/R26-reserved-team.json}
      - gate: {expect: failure, gates: [G3]}
  - id: R12
    title: Literal git revert of a bootstrapped (never-approved) seed is rejected
    criterion: "§13 #11 · revert class · x_kf.bootstrap"
    steps:
      - revert:
          seed_path: application-bundles/kfcor/knowledge-sources/agile-ceremonies/standup/fabric-core/standup_2026-10-19.md
          literal: true
          as: rv
      - gate: {of: rv, expect: failure, class: revert, gates: [RV]}
  - id: R31
    title: Ceremony PR title does not follow the naming convention
    criterion: "spec v0.5 naming · G3"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R31-wrong-pr-title.json}
      - gate: {expect: failure, gates: [G3]}
  - id: R32
    title: Named approver is not in the app's OWNERS (nor a steward)
    criterion: "spec v0.5 OWNERS · G7"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R32-approver-not-in-owners.json}
      - gate: {expect: failure, gates: [G7]}
  - id: R33
    title: Approver owns a DIFFERENT app — their OWNERS entry does not carry over to kfcor
    criterion: "spec v0.5 OWNERS · cross-app isolation · G7"
    steps:
      - edit:
          branch: main
          message: "fixture: kfsit is owned by other people"
          ops:
            - {op: write, file: application-bundles/kfsit/OWNERS, content: "approvers:\n  - kf-nonowner-demo\n  - kf-writer-demo\n"}
            - {op: write, file: application-bundles/kfcor/OWNERS, content: "approvers:\n  - genlinemedia\n  - muthub-ai\n"}
      - simulate: {scenario: scenarios/cases/R33-approver-owns-other-app.json}
      - gate: {expect: failure, gates: [G7]}
  # ------------------------------------------------------------------ owners class
  - id: F13
    title: An app's OWNERS file is claimed by PR — a KF steward approves, then the app governs itself
    criterion: "spec v0.5 OWNERS claim"
    steps:
      - edit:
          branch: owners/kfsit
          title: "[KF-OWNERS] kfsit — claim app for site-build and explorer-ux"
          ops:
            - {op: write, file: application-bundles/kfsit/OWNERS, content: "# OWNERS for kfsit\napprovers:\n  - genlinemedia\n  - muthub-ai\n  - kf-writer-demo\n"}
      - gate: {expect: action_required, class: owners}
      - review: {user: genlinemedia}
      - gate: {expect: success}
  - id: R34
    title: OWNERS change approved by someone who is not a current approver — stays pending
    criterion: "spec v0.5 OWNERS · approval"
    steps:
      - edit:
          branch: owners/kfsit
          title: "[KF-OWNERS] kfsit — add a reviewer"
          ops:
            - {op: write, file: application-bundles/kfsit/OWNERS, content: "approvers:\n  - genlinemedia\n  - muthub-ai\n  - kf-nonowner-demo\n"}
      - review: {user: kf-nonowner-demo}
      - gate: {expect: action_required, class: owners}
  - id: R35
    title: OWNERS change on the wrong branch / with the wrong title
    criterion: "spec v0.5 naming · OW"
    steps:
      - edit:
          branch: tweak-owners
          title: "update owners"
          ops:
            - {op: write, file: application-bundles/kfsit/OWNERS, content: "approvers:\n  - genlinemedia\n  - muthub-ai\n  - kf-writer-demo\n"}
      - gate: {expect: failure, class: owners, gates: [OW]}
  - id: R36
    title: OWNERS change mixed with a section edit — fails closed
    criterion: "spec v0.5 · one kind of change per PR"
    steps:
      - edit:
          branch: owners/kfsit
          title: "[KF-OWNERS] kfsit — claim app"
          ops:
            - {op: write, file: application-bundles/kfsit/OWNERS, content: "approvers:\n  - genlinemedia\n  - kf-writer-demo\n"}
            - {op: write, file: application-bundles/kfsit/sections/notes.md, content: "smuggled\n"}
      - gate: {expect: failure, class: unknown, gates: [CLASS]}
  # ------------------------------------------------------------------ red paths: bundle-update class
  - id: R11
    title: Bundle update touches knowledge-sources/
    criterion: "D18 · B1"
    live: true
    steps:
      - bundle_edit:
          appid: kfcor
          ops:
            - {op: set_approver, file: knowledge-source.json, value: "@genlinemedia"}
            - {op: write, file: knowledge-sources/agile-ceremonies/standup/fabric-core/notes.md, content: "smuggled\n"}
      - gate: {expect: failure, gates: [B1]}
  - id: R21
    title: Section made only of assessments (50% cap)
    criterion: "§6.3 G6-bundle rule (3) · confirm-round fixture"
    steps:
      - bundle_edit:
          appid: kfcor
          ops:
            - {op: replace, file: sections/executive-summary.md, find: "## Why it matters\n",
               replace: "## Why it matters\n\n*Assessment:* Extra opinion one.[^readme-repos]\n\n*Assessment:* Extra opinion two.[^readme-repos]\n\n*Assessment:* Extra opinion three.[^readme-repos]\n\n*Assessment:* Extra opinion four.[^readme-repos]\n\n*Assessment:* Extra opinion five.[^readme-repos]\n\n*Assessment:* Extra opinion six.[^readme-repos]\n\n*Assessment:* Extra opinion seven.[^readme-repos]\n\n*Assessment:* Extra opinion eight.[^readme-repos]\n\n"}
      - gate: {expect: failure, gates: [B6]}
  - id: R22
