# Scenario matrix — the single source of truth for the demo gallery (plan §8).
# Every scenario names the spec v0.4 acceptance criterion (§13 #n) or plan decision it proves.
# run_fixtures.py replays all of them in gate local mode; open_live_prs.py opens the `live: true`
# ones as real PRs. README's matrix is generated from this file (run_fixtures.py --write-readme).
schema: kf-scenario-matrix/1
identities: scenarios/fixtures/identities.yml
default_now: "2026-10-20T23:00:00Z"
scenarios:
  # ------------------------------------------------------------------ green paths
  - id: F01
    title: Standup awaits the named approver; another writer's approval does not count; named approval passes
    criterion: "§13 #2, #3 · I3 · S first-contribution warn"
    steps:
      - simulate: {scenario: scenarios/cases/D01-kfcor-fabric-core-standup.json}
      - gate: {expect: action_required, class: ceremony, warns: [S]}
      - review: {user: kf-writer-demo}
      - gate: {expect: action_required}
      - review: {user: genlinemedia}
      - gate: {expect: success}
  - id: F02
    title: Rerun for the same meeting updates the same branch — no duplicate PRs
    criterion: "§13 #8 · I2 · D13"
    steps:
      - simulate: {scenario: scenarios/cases/D01-kfcor-fabric-core-standup.json}
      - refresh: {scenario: scenarios/cases/D01b-kfcor-fabric-core-standup-rerun.json}
      - gate: {expect: action_required}
  - id: F03
    title: Three established kfcor teams land same-day standups — zero conflicts, zero refresh, zero re-approval
    criterion: "§13 #7a · I9 (team isolation)"
    steps:
      - simulate: {scenario: scenarios/cases/D01-kfcor-fabric-core-standup.json, as: a}
      - simulate: {scenario: scenarios/cases/D02-kfcor-librarian-ops-standup.json, as: b}
      - simulate: {scenario: scenarios/cases/D03-kfcor-graph-platform-standup.json, as: c}
      - review: {of: a, user: genlinemedia}
      - review: {of: b, user: genlinemedia}
      - review: {of: c, user: genlinemedia}
      - gate: {of: a, expect: success}
      - merge: {of: a}
      - gate: {of: b, expect: success}
      - merge: {of: b}
      - gate: {of: c, expect: success}
      - merge: {of: c}
  - id: F04
    title: Two teams' FIRST sprint-planning entries land the same day — no manifest, so no conflict and no --refresh
    criterion: "spec v0.5 write-set (knowledge-sources/ only) · I9"
    steps:
      - simulate: {scenario: scenarios/cases/D04-kfcor-fabric-core-sprint-planning.json, as: a}
      - simulate: {scenario: scenarios/cases/D05-kfcor-graph-platform-sprint-planning.json, as: b}
      - review: {of: a, user: genlinemedia}
      - review: {of: b, user: genlinemedia}
      - gate: {of: a, expect: success}
      - merge: {of: a}
      - gate: {of: b, expect: success}
      - merge: {of: b}
  - id: F05
    title: --refresh two days after approval keeps the approval (dates frozen in the GrillResult)
    criterion: "§13 #8 · determinism rule §8.2"
    steps:
      - simulate: {scenario: scenarios/cases/D01-kfcor-fabric-core-standup.json, as: a}
      - review: {of: a, user: genlinemedia}
      - simulate: {scenario: scenarios/cases/D02-kfcor-librarian-ops-standup.json, as: other}
      - merge: {of: other}
      - refresh: {of: a}
      - gate: {of: a, expect: success, now: "2026-10-22T23:00:00Z"}
  - id: F06
    title: Retro profile with Went well / To improve / ACT / RSK passes
    criterion: "§5.2 ceremony profiles"
    steps:
      - simulate: {scenario: scenarios/cases/D06-kfsit-site-build-retro.json}
      - gate: {expect: action_required}
  - id: F07
    title: Valid revert — semantic inverse of a merged ceremony PR, approved by the original approver
    criterion: "§13 #11 · §8.5 revert class"
    steps:
      - simulate: {scenario: scenarios/cases/D02-kfcor-librarian-ops-standup.json, as: a}
      - review: {of: a, user: genlinemedia}
      - merge: {of: a}
      - revert: {of: a, as: rv, reason: "fixture removal of sensitive content"}
      - gate: {of: rv, expect: action_required, class: revert}
      - review: {of: rv, user: genlinemedia}
      - gate: {of: rv, expect: success}
  - id: F08
    title: Bundle update — citations verified at the pinned SHA, graph reproduced, owner approves
    criterion: "D18 bundle-update class · G6-bundle · G11"
    steps:
      - bundle_edit:
          appid: kfcor
          ops:
            - {op: replace, file: sections/executive-summary.md, find: "## Why it matters\n",
               replace: "## Why it matters\n\nThe site repository is a separate consumer that builds only from release assets.[^readme-repos]\n\n"}
      - gate: {expect: action_required, class: bundle-update}
      - review: {user: muthub-ai}
      - gate: {expect: success}
  - id: F09
    title: Trust-root/tooling change needs a code owner's approval
    criterion: "plan §6.1 tooling class · P1"
    steps:
      - edit: {branch: tooling/fixture-note, ops: [{op: write, file: scenarios/NOTES.md, content: "fixture note\n"}]}
      - gate: {expect: action_required, class: tooling}
      - review: {user: muthub-ai}
      - gate: {expect: success}
  - id: F10
    title: Docs-only change passes without approval
    criterion: "plan §6.1 other class"
    steps:
      - edit: {branch: docs/fixture-note, ops: [{op: write, file: docs/fixture-note.md, content: "note\n"}]}
      - gate: {expect: success, class: other}
  - id: F11
    title: Zero findings — no file, no PR
    criterion: "§13 #10 · I7"
    steps:
      - zero: {scenario: scenarios/cases/Z01-zero-findings.json}
  - id: F12
    title: Clobber protection — the safe-push author check aborts on someone else's open PR
    criterion: "§7.2 step 1 · E6"
    steps:
      - unit: {check: author_check}
  # ------------------------------------------------------------------ live-only green demos
  # Same logic as F01 / F08, but with content no fixture reuses: once a live demo PR is merged,
  # main contains it, and the fixtures (which start from main) must not collide with it.
  # run_fixtures.py skips these unless named with --only.
  - id: L01
    title: "Live green ceremony: standup waits for @genlinemedia, passes on approval"
    criterion: "§13 #2, #3 · I3 (live)"
    live: true
    live_only: true
    steps:
      - simulate: {scenario: scenarios/cases/D01-kfcor-fabric-core-standup.json}
      - gate: {expect: action_required, class: ceremony}
      - review: {user: genlinemedia}
      - gate: {expect: success}
  - id: L02
    title: "Live green bundle update: cited aacod claim, owner @genlinemedia approves"
    criterion: "D18 bundle-update · G6-bundle · G11 (live)"
    live: true
    live_only: true
    steps:
      - bundle_edit:
          appid: aacod
          ops:
            - {op: set_approver, file: knowledge-source.json, value: "@genlinemedia"}
            - {op: replace, file: sections/executive-summary.md, find: "## Shape in numbers\n",
               replace: "The `aac` command-line tool's entry point is `cli/bin/aac.ts`.[^g-cli-entry]\n\n## Shape in numbers\n"}
          summary: Executive summary names the CLI entry point
          bullet: Adds a cited sentence naming the aac CLI entry point.
      - gate: {expect: action_required, class: bundle-update}
      - review: {user: genlinemedia}
      - gate: {expect: success}
  # ------------------------------------------------------------------ red paths: ceremony class
  - id: R01
    title: Ceremony PR also touches a second appid
    criterion: "§13 #5 · G1"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R01-second-appid.json}
      - gate: {expect: failure, gates: [G1]}
  - id: R02
    title: Ceremony PR edits a bundle section (out of allowlist)
    criterion: "§13 #5 · G1"
    steps:
      - simulate: {scenario: scenarios/cases/R02-out-of-allowlist.json}
      - gate: {expect: failure, gates: [G1]}
  - id: R03
    title: Wrong-appid coherence — path says kfcor, frontmatter says kfsit
    criterion: "D19 · G3"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R03-wrong-appid-coherence.json}
      - gate: {expect: failure, gates: [G3]}
  - id: R04
    title: Unregistered appid folder
    criterion: "D19 registry · G3"
    steps:
      - simulate: {scenario: scenarios/cases/R04-unregistered-appid.json}
      - gate: {expect: failure, gates: [G3]}
  - id: R05
    title: Team not registered under the appid (team→appid binding)
    criterion: "D19 · G3 hard binding"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R05-team-not-under-appid.json}
      - gate: {expect: failure, gates: [G3]}
  - id: R06
    title: Evidence span tampered — hash no longer matches
    criterion: "§13 #5 · G6"
    live: true
    steps:
      - simulate: {scenario: scenarios/cases/R06-span-hash-broken.json}
